name: MW security audit

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit requirements
        run: python -m pip_audit -r requirements.txt
      - name: Run tests
        run: python -m pytest
